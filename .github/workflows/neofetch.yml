name: refresh neofetch card

on:
  schedule:
    - cron: "0 11 * * 1"   # Mondays, 06:00 America/Chicago
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/neofetch.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neofetch
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # GH_PAT is optional. Without it the run sees only my public repos and
      # falls back to scripts/langs-snapshot.json for the rest.
      - name: render
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/neofetch.py

      - name: commit if changed
        run: |
          if git diff --quiet -- assets; then
            echo "card unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "neofetch: refresh card"
          git push
